openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Browser authentication.
  - name: tenders
    description: Pakistan government IT tender workspaces.
  - name: evidence
    description: Tender evidence and OEM source records.
  - name: proposals
    description: Separate technical and commercial proposal drafts.
  - name: storage
    description: Secure document upload endpoints.
paths:
  /company-evidence:
    get:
      operationId: listCompanyEvidence
      responses:
        "200":
          description: Private reusable evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyEvidence" }
    post:
      operationId: createCompanyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEvidenceInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyEvidence" }
  /company-evidence/{companyEvidenceId}:
    parameters:
      - name: companyEvidenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCompanyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEvidenceMetadata" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyEvidence" }
    delete:
      operationId: deleteCompanyEvidence
      responses:
        "204": { description: Removed from library; tender copies retained }
  /tenders/{tenderId}/company-evidence:
    parameters:
      - name: tenderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: linkCompanyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEvidenceLink" }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
  /evidence/{evidenceId}/applicability:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: reviewEvidenceApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceApplicability" }
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current authentication state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirects to the identity provider.
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete browser login
      responses:
        "302":
          description: Redirects to the app after login.
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: Sign out the current browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Clears the session and redirects.
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [tenders]
      summary: Get dashboard totals and recent tender work
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /tenders:
    get:
      operationId: listTenders
      tags: [tenders]
      summary: List the user's tenders
      responses:
        "200":
          description: Tender list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tender"
    post:
      operationId: createTender
      tags: [tenders]
      summary: Create a tender workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderInput"
      responses:
        "201":
          description: Created tender.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"
  /tenders/{tenderId}:
    get:
      operationId: getTender
      tags: [tenders]
      summary: Get a tender and its workspace counts
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: Tender workspace details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderDetail"
        "404":
          description: Tender not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateTender
      tags: [tenders]
      summary: Update tender details
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderUpdate"
      responses:
        "200":
          description: Updated tender.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tender"
    delete:
      operationId: deleteTender
      tags: [tenders]
      summary: Delete a tender workspace and its metadata
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "204":
          description: Deleted.
  /tenders/{tenderId}/requirements/extract:
    post:
      operationId: extractTenderRequirements
      tags: [tenders]
      summary: Extract a reviewable brief from this tender's uploaded RFP documents
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequirementsInput"
      responses:
        "200":
          description: Tender with a durable extraction job; advance one section at a time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tender" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /tenders/{tenderId}/requirements/process:
    post:
      operationId: processTenderRequirements
      tags: [tenders]
      summary: Advance one section of an explicitly consented extraction job
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: Tender with current progress or the completed extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tender" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tenders/{tenderId}/requirement-items:
    get:
      operationId: listRequirementItems
      tags: [requirement-items]
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: Individual requirements and their evidence and supplier options.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RequirementItem" } }
    post:
      operationId: createRequirementItem
      tags: [requirement-items]
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementDraft" }
      responses:
        "201":
          description: Added individual requirement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementItem" }
  /tenders/{tenderId}/requirement-items/import:
    post:
      operationId: importRequirementItems
      tags: [requirement-items]
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractRequirementsInput" }
      responses:
        "200":
          description: Requirements added without overwriting existing human work.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RequirementItem" } }
  /requirement-items/{requirementId}:
    parameters:
      - name: requirementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRequirementItem
      tags: [requirement-items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementItemUpdate" }
      responses:
        "200":
          description: Updated requirement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementItem" }
    delete:
      operationId: deleteRequirementItem
      tags: [requirement-items]
      responses:
        "204": { description: Requirement removed; original evidence files retained. }
  /requirement-items/{requirementId}/research:
    parameters:
      - name: requirementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: researchRequirementSuppliers
      tags: [requirement-items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractRequirementsInput" }
      responses:
        "200":
          description: Persisted sourced product and Pakistan-delivery supplier candidates awaiting review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementItem" }
  /requirement-items/{requirementId}/options:
    parameters:
      - name: requirementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addRequirementSupplierOption
      tags: [requirement-items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierOptionInput" }
      responses:
        "201":
          description: Added manually sourced supplier quotation or product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementItem" }
  /requirement-items/{requirementId}/selection:
    parameters:
      - name: requirementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: selectRequirementSupplier
      tags: [requirement-items]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequirementSelectionInput" }
      responses:
        "200":
          description: Human-reviewed product and supplier selection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementItem" }
  /tenders/{tenderId}/evidence:
    get:
      operationId: listTenderEvidence
      tags: [evidence]
      summary: List evidence attached to a tender
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: Evidence list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: addTenderEvidence
      tags: [evidence]
      summary: Attach uploaded evidence and its human-provided notes
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Attached evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
  /evidence/{evidenceId}:
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      summary: Remove evidence metadata from a tender
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
  /tenders/{tenderId}/vendor-sources:
    get:
      operationId: listVendorSources
      tags: [evidence]
      summary: List OEM source claims and their review state
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: OEM source list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorSource"
    post:
      operationId: addVendorSource
      tags: [evidence]
      summary: Add an OEM claim and its official source URL
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSourceInput"
      responses:
        "201":
          description: Added source claim, awaiting review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSource"
  /tenders/{tenderId}/vendor-sources/research:
    post:
      operationId: researchVendorSource
      tags: [evidence]
      summary: Extract candidate product facts from a public OEM page
      description: User-provided page content is untrusted; extracted claims remain unverified until human review.
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorResearchInput"
      responses:
        "200":
          description: Candidate claims extracted from the selected source page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorResearchResult"
        "400":
          description: Invalid or unsupported source URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /vendor-sources/{sourceId}:
    patch:
      operationId: reviewVendorSource
      tags: [evidence]
      summary: Edit or review an OEM claim
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSourceUpdate"
      responses:
        "200":
          description: Updated source claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSource"
  /tenders/{tenderId}/proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List technical and commercial drafts for a tender
      parameters:
        - $ref: "#/components/parameters/TenderId"
      responses:
        "200":
          description: Proposal drafts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
  /tenders/{tenderId}/proposals/generate:
    post:
      operationId: generateProposalPair
      tags: [proposals]
      summary: Draft separate technical and commercial proposals
      description: Requires explicit confirmation that selected content may be processed by AI.
      parameters:
        - $ref: "#/components/parameters/TenderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProposalInput"
      responses:
        "201":
          description: Technical and commercial drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalPair"
        "400":
          description: AI processing consent is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /proposals/{proposalId}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Load a saved proposal draft
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
    patch:
      operationId: updateProposal
      tags: [proposals]
      summary: Edit a proposal draft or mark it reviewed
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalUpdate"
      responses:
        "200":
          description: Updated proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
  /proposal-library:
    get:
      operationId: listProposalLibrary
      tags: [library]
      summary: Search the signed-in user's past tender-proposal pairs
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string, enum: [hardware, networking, software, services, mixed] }
        - name: outcome
          in: query
          schema: { type: string, enum: [won, lost, rejected, unknown] }
      responses:
        "200":
          description: Matching historical pairs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
    post:
      operationId: createLibraryEntry
      tags: [library]
      summary: Archive an uploaded tender-proposal pair or approved generated pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryEntryInput" }
      responses:
        "201":
          description: Archived pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryEntryDetail" }
  /proposal-library/{entryId}:
    get:
      operationId: getLibraryEntry
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/LibraryEntryId"
      responses:
        "200":
          description: Archived documents and searchable extracted text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryEntryDetail" }
    patch:
      operationId: updateLibraryEntry
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/LibraryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryEntryUpdate" }
      responses:
        "200":
          description: Updated archive metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryEntryDetail" }
    delete:
      operationId: deleteLibraryEntry
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/LibraryEntryId"
      responses:
        "204":
          description: Archive deleted.
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private file upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL and storage path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /documents/activity:
    get:
      operationId: listDocumentReadingActivity
      tags: [evidence]
      summary: List the signed-in owner's document reading metadata without document content
      responses:
        "200":
          description: Persisted reading activity and links to human review screens. Does not enqueue or authorize processing.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentReadingActivity" }
        "401":
          $ref: "#/components/responses/Error"
  /documents/extraction:
    get:
      operationId: getDocumentExtraction
      tags: [evidence]
      summary: Read separate source text and local OCR review state
      parameters:
        - name: objectPath
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Extraction, or null for a legacy upload not processed yet.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DocumentExtraction"
                  - type: "null"
    post:
      operationId: extractUploadedDocument
      tags: [evidence]
      summary: Queue durable local extraction without sending document images to an AI provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionInput" }
      responses:
        "200":
          description: Saved extraction state; queued and running jobs continue independently of this request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentExtraction" }
    patch:
      operationId: reviewDocumentExtraction
      tags: [evidence]
      summary: Verify corrected OCR against the original or reject it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionReview" }
      responses:
        "200":
          description: Saved human review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentExtraction" }
  /documents/extraction/cancel:
    post:
      operationId: cancelDocumentExtraction
      tags: [evidence]
      summary: Cancel an owned queued or running reading without deleting its original
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtractionCancellation" }
      responses:
        "200":
          description: Cancelled reading. Repeating cancellation of the same attempt is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentExtraction" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Request could not be completed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  parameters:
    LibraryEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenderId:
      name: tenderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    DocumentReadingActivity:
      type: object
      required: [id, name, objectPath, status, completedPages, totalPages, queuedAt, finishedAt, reviewLinks]
      properties:
        id: { type: string }
        name: { type: string }
        objectPath: { type: string }
        status: { type: string, enum: [queued, running, cancelled, not_needed, needs_review, verified, rejected, failed] }
        completedPages: { type: integer }
        totalPages: { type: [integer, "null"] }
        queuedAt: { type: string }
        finishedAt: { type: [string, "null"] }
        reviewLinks:
          type: array
          items: { $ref: "#/components/schemas/DocumentReadingLink" }
    DocumentReadingLink:
      type: object
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string }
    ExtractionCancellation:
      type: object
      required: [objectPath, jobId]
      properties:
        objectPath: { type: string, minLength: 1 }
        jobId: { type: string, format: uuid }
    ExtractionInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
        retry:
          type: boolean
          default: false
          description: Explicitly retry a failed or cancelled reading. Cancelled readings never restart automatically, including on language changes.
        language:
          $ref: "#/components/schemas/OcrLanguage"
    OcrLanguage:
      type: string
      enum: [eng, urd, "eng+urd"]
      description: Local recognition language. Omit to retain an existing extraction's language, or use English for a new extraction.
    ExtractionReview:
      type: object
      required: [objectPath, status, confirmed]
      properties:
        objectPath: { type: string, minLength: 1 }
        status: { type: string, enum: [verified, rejected] }
        confirmed: { type: boolean }
        reviewedText: { type: string, maxLength: 500000 }
        language:
          $ref: "#/components/schemas/OcrLanguage"
          description: Language of the OCR being reviewed; legacy requests default to English. Stale reviews of another language are rejected.
    DocumentExtraction:
      type: object
      required: [sourceText, ocrText, confidence, pages, status, error, reviewedText, reviewedAt, engine]
      properties:
        sourceText: { type: string }
        ocrText: { type: string }
